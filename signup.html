<!DOCTYPE html>
<html>
<head>
    <title>NewsTech - Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar">
    <div class="container">
        <a class="navbar-brand" href="index.html">NewsTech</a>

        <div>
            <a href="index.html" class="text-dark me-3">Home</a>
            <a href="login.html" class="text-dark me-3">Login</a>
            <a href="signup.html" class="text-dark">Sign Up</a>
        </div>
    </div>
</nav>

<div class="container mt-5">

    <h1 class="text-center">Sign Up</h1>
    <p class="text-center">Create your NewsTech account.</p>

    <div class="row justify-content-center mt-4">
        <div class="col-md-5">

            <form action="login.html">

                <label>Name</label>
                <input type="text" class="form-control mb-3"
                       placeholder="Enter your name" required>

                <label>Email</label>
                <input type="email" class="form-control mb-3"
                       placeholder="Enter your email" required>

                <label>Password</label>
                <input type="password" class="form-control mb-3"
                       placeholder="Enter password" required>

                <label>Confirm Password</label>
                <input type="password" class="form-control mb-3"
                       placeholder="Confirm password" required>

                <button type="submit" class="btn border rounded">
                    Sign Up
                </button>

            </form>

            <p class="mt-3">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>
    </div>

</div>

</body>
</html>
