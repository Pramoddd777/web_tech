<!DOCTYPE html>
<html>

<head>

    <title>Sign Up - NewsTech</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand" href="index.html">
                NewsTech
            </a>

            <div>

                <a href="index.html" class="text-white me-3">
                    Home
                </a>

                <a href="login.html" class="text-white me-3">
                    Login
                </a>

                <a href="signup.html" class="text-white">
                    Sign Up
                </a>

            </div>

        </div>

    </nav>


    <!-- Sign Up Form -->

    <div class="container mt-5">

        <h2>Sign Up</h2>

        <form action="login.html">

            <div class="mb-3">

                <label class="form-label">
                    Name
                </label>

                <input type="text"
                       class="form-control"
                       placeholder="Enter your name"
                       required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input type="email"
                       class="form-control"
                       placeholder="Enter your email"
                       required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input type="password"
                       class="form-control"
                       placeholder="Enter password"
                       required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Confirm Password
                </label>

                <input type="password"
                       class="form-control"
                       placeholder="Confirm password"
                       required>

            </div>


            <button type="submit" class="btn btn-primary">
                Sign Up
            </button>

        </form>


        <p class="mt-3">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

</body>

</html>
